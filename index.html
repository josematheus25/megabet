<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mega Bet</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: #f0f0f0;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .app { max-width: 480px; margin: 0 auto; }

    h1 { font-size: 26px; font-weight: 700; text-align: center; margin-bottom: 4px; }
    .subtitle { font-size: 13px; color: #888; text-align: center; margin-bottom: 1.5rem; }

    /* Banner dos times */
    .times-banner {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-bottom: 1.25rem;
      padding: 14px 20px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      min-height: 70px;
    }

    .time-bloco {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .time-logo {
      width: 52px;
      height: 52px;
      object-fit: contain;
      border-radius: 6px;
    }

    .time-logo-placeholder {
      width: 52px;
      height: 52px;
      border-radius: 6px;
      background: #2a2a2a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .time-nome  { font-size: 15px; font-weight: 700; text-align: center; }
    .times-vs   { font-size: 18px; font-weight: 700; color: #444; align-self: center; }
    .times-loading { font-size: 12px; color: #555; }

    /* Cards */
    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 1rem 1.25rem;
      margin-bottom: 1rem;
    }

    .section-label {
      font-size: 11px; font-weight: 600; color: #888;
      text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px;
    }

    input[type=text], input[type=number] {
      width: 100%; padding: 10px 12px;
      background: #111; border: 1px solid #333; border-radius: 8px;
      color: #f0f0f0; font-size: 14px; outline: none; transition: border-color .15s;
    }
    input:focus { border-color: #555; }
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }

    .score-row {
      display: grid; grid-template-columns: 1fr 24px 1fr;
      align-items: center; gap: 8px;
    }

    .team-labels {
      display: grid; grid-template-columns: auto 1fr 20px 1fr;
      gap: 0 8px; margin-bottom: 6px;
    }
    .team-label { font-size: 11px; font-weight: 600; color: #888; text-align: center; }

    .sets-grid {
      display: grid; grid-template-columns: auto 1fr 20px 1fr;
      align-items: center; gap: 8px;
    }
    .set-label { font-size: 12px; color: #888; white-space: nowrap; padding-right: 4px; }
    .vs        { font-size: 12px; color: #555; text-align: center; }

    .btn {
      width: 100%; padding: 13px; background: #e94560;
      color: #fff; border: none; border-radius: 10px;
      font-size: 15px; font-weight: 700; cursor: pointer;
      transition: opacity .15s, transform .1s; margin-top: 4px;
    }
    .btn:hover   { opacity: .9; }
    .btn:active  { transform: scale(.98); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    .status { display: none; font-size: 13px; text-align: center; padding: 10px; border-radius: 8px; margin-top: 10px; }
    .status.ok      { display: block; background: #0d2e1a; color: #4caf7d; border: 1px solid #1a4d2e; }
    .status.err     { display: block; background: #2e0d0d; color: #e57373; border: 1px solid #4d1a1a; }
    .status.loading { display: block; background: #1a1a1a; color: #888;    border: 1px solid #2a2a2a; }
  </style>
</head>
<body>

<div class="app">
  <h1>🏐 Mega Bet</h1>
  <p class="subtitle">Insira seu palpite para a partida</p>

  <!-- Banner dos times -->
  <div class="times-banner" id="times-banner">
    <span class="times-loading">Carregando times...</span>
  </div>

  <!-- Nome -->
  <div class="card">
    <div class="section-label">Seu nome</div>
    <input type="text" id="nome" placeholder="Como você se chama?">
  </div>

  <!-- Sets -->
  <div class="card">
    <div class="section-label">Placar de sets</div>
    <div class="score-row">
      <input type="number" id="setsA" min="0" max="3" placeholder="0">
      <div class="vs">x</div>
      <input type="number" id="setsB" min="0" max="3" placeholder="0">
    </div>
  </div>

  <!-- Pontos por set -->
  <div class="card">
    <div class="section-label">Pontos por set</div>
    <div class="team-labels">
      <div></div>
      <div class="team-label" id="header-a">Time A</div>
      <div></div>
      <div class="team-label" id="header-b">Time B</div>
    </div>
    <div class="sets-grid" id="sets-grid"></div>
  </div>

  <button class="btn" id="btn-apostar">Confirmar aposta</button>
  <div class="status" id="status"></div>
</div>

<script>
  const FIREBASE_BASE    = "https://mega-bet-4db11-default-rtdb.firebaseio.com";
  const FIREBASE_APOSTAS = `${FIREBASE_BASE}/apostas.json`;
  const FIREBASE_TIMES   = `${FIREBASE_BASE}/times.json`;

  // Monta campos de pontos por set
  const grid = document.getElementById("sets-grid");
  for (let i = 0; i < 5; i++) {
    grid.innerHTML += `
      <span class="set-label">${i + 1}º set</span>
      <input type="number" id="a${i}" min="0" placeholder="0">
      <span class="vs">x</span>
      <input type="number" id="b${i}" min="0" placeholder="0">
    `;
  }

  // ── Carrega times e logos do Firebase ──
  let nomeA = "Time A";
  let nomeB = "Time B";

  function blocoTime(nome, logoB64) {
    const logoHtml = logoB64
      ? `<img class="time-logo" src="data:image/png;base64,${logoB64}" alt="${nome}">`
      : `<div class="time-logo-placeholder">🏐</div>`;
    return `
      <div class="time-bloco">
        ${logoHtml}
        <span class="time-nome">${nome}</span>
      </div>
    `;
  }

  async function carregarTimes() {
    try {
      const resp  = await fetch(FIREBASE_TIMES);
      if (!resp.ok) throw new Error();
      const dados = await resp.json();
      if (dados?.A?.nome) nomeA = dados.A.nome;
      if (dados?.B?.nome) nomeB = dados.B.nome;

      const logoA = dados?.A?.logo_b64 || null;
      const logoB = dados?.B?.logo_b64 || null;

      document.getElementById("times-banner").innerHTML =
        blocoTime(nomeA, logoA) +
        `<span class="times-vs">VS</span>` +
        blocoTime(nomeB, logoB);

    } catch (_) {
      // Fallback sem logo
      document.getElementById("times-banner").innerHTML =
        blocoTime(nomeA, null) +
        `<span class="times-vs">VS</span>` +
        blocoTime(nomeB, null);
    }

    // Atualiza labels e placeholders
    document.getElementById("header-a").textContent  = nomeA;
    document.getElementById("header-b").textContent  = nomeB;
    document.getElementById("setsA").placeholder     = nomeA;
    document.getElementById("setsB").placeholder     = nomeB;
  }

  carregarTimes();

  // ── Status ──
  const statusEl = document.getElementById("status");
  function showStatus(msg, tipo) {
    statusEl.textContent = msg;
    statusEl.className   = "status " + tipo;
  }

  // ── Limpar campos ──
  function limparCampos() {
    ["nome", "setsA", "setsB"].forEach(id => document.getElementById(id).value = "");
    for (let i = 0; i < 5; i++) {
      document.getElementById("a" + i).value = "";
      document.getElementById("b" + i).value = "";
    }
  }

  // ── Enviar aposta ──
  document.getElementById("btn-apostar").addEventListener("click", async () => {
    const nome = document.getElementById("nome").value.trim();
    if (!nome) { showStatus("Digite seu nome antes de apostar.", "err"); return; }

    const setsA = document.getElementById("setsA").value;
    const setsB = document.getElementById("setsB").value;
    if (setsA === "" || setsB === "") { showStatus("Preencha o placar de sets.", "err"); return; }

    const pontos = [];
    for (let i = 0; i < 5; i++) {
      const a = document.getElementById("a" + i).value;
      const b = document.getElementById("b" + i).value;
      if (a === "" || b === "") { showStatus(`Preencha os pontos do ${i + 1}º set.`, "err"); return; }
      pontos.push([Number(a), Number(b)]);
    }

    const aposta = { nome, sets_a: Number(setsA), sets_b: Number(setsB), pontos };
    const btn    = document.getElementById("btn-apostar");
    btn.disabled = true;
    showStatus("Enviando aposta...", "loading");

    try {
      const resp = await fetch(FIREBASE_APOSTAS, {
        method:  "POST",
        headers: { "Content-Type": "application/json" },
        body:    JSON.stringify(aposta)
      });
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      showStatus("✔ Aposta enviada com sucesso!", "ok");
      limparCampos();
    } catch (e) {
      showStatus("Falha ao enviar. Verifique sua conexão.", "err");
    } finally {
      btn.disabled = false;
    }
  });
</script>

</body>
</html>
